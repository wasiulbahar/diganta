<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diganta</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --bg:#0b0f14; --panel:rgba(12,16,22,.9); --fg:#eef2f6; --accent:#ffb020; --muted:#9aa6b2; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui,sans-serif; }
  #sat { position:fixed; inset:0; }
  .hud { position:fixed; top:12px; left:12px; z-index:1000; background:var(--panel); padding:8px 14px; border-radius:10px; max-width:calc(100vw - 80px); }
  .hud b { color:var(--accent); }
  .hud a { color:var(--muted); margin-left:10px; cursor:pointer; text-decoration:underline; }
  #jhud .look { color:var(--muted); font-size:13px; margin-top:2px; }
  #jhud .row { display:flex; gap:8px; margin-top:8px; }
  #jhud button { width:auto; padding:6px 12px; border-radius:8px; font-size:13px; }
  #jhud .ghost { background:transparent; color:var(--fg); border:1px solid #445; }
  #hint { color:var(--accent); font-weight:600; margin-top:6px; }
  #guessBox { position:fixed; right:16px; bottom:16px; z-index:1000; width:min(320px,calc(100vw - 32px)); transition:width .25s; }
  #guessBox:hover { width:min(620px,calc(100vw - 32px)); }
  #guessMap { height:220px; border-radius:10px 10px 0 0; transition:height .25s; }
  #guessBox:hover #guessMap { height:min(420px,55vh); }
  button { width:100%; border:0; padding:12px; font:600 15px system-ui; background:var(--accent); color:#111; border-radius:0 0 10px 10px; cursor:pointer; }
  button:disabled { background:#555; color:#999; cursor:not-allowed; }
  #result { position:fixed; inset:auto 0 0 0; z-index:1100; background:var(--panel); padding:16px; display:none; text-align:center; }
  #result h2 { margin:0 0 4px; }
  #result p { margin:0 0 12px; color:var(--muted); }
  #result button, #menu button { max-width:260px; border-radius:10px; }
  #resultMap { height:45vh; border-radius:10px; margin-bottom:12px; }
  #menu { position:fixed; inset:0; z-index:1200; background:rgba(5,8,12,.72); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:16px; text-align:center; }
  #menu h1 { margin:0; font-size:40px; letter-spacing:.5px; }
  #menu p { margin:0 0 6px; color:var(--muted); max-width:420px; }
  #menu small { display:block; font-weight:400; font-size:12px; opacity:.75; }
  #compass { position:fixed; left:16px; bottom:30px; z-index:1000; pointer-events:none; filter:drop-shadow(0 2px 6px rgba(0,0,0,.5)); }
  #fhud label { display:inline-flex; gap:6px; align-items:center; margin-top:8px; cursor:pointer; }
  #fhud .row { display:flex; gap:12px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  #fhud button { width:auto; padding:6px 12px; border-radius:8px; font-size:13px; }
  #fPlace { color:var(--muted); font-size:13px; margin-top:4px; }
  #searchForm { display:flex; gap:6px; margin-top:8px; }
  #searchForm input { flex:1; min-width:0; padding:7px 10px; border-radius:8px; border:1px solid #445; background:#0b0f14; color:var(--fg); font:14px system-ui; }
  #gHints { margin:6px 0 0; padding-left:18px; font-size:13px; color:var(--accent); }
  #gHints:empty { display:none; }
  button.small { width:auto; padding:6px 12px; border-radius:8px; font-size:13px; margin-top:8px; }
  #factCard { max-width:640px; margin:0 auto 14px; text-align:left; background:rgba(255,255,255,.05); border-left:3px solid var(--accent); border-radius:8px; padding:10px 14px; }
  #factCard p { margin:0; color:var(--fg); }
  #factCard #clueText { margin-top:8px; color:var(--muted); font-size:14px; }
  #clueText b { color:var(--accent); }
  #result #resultMap { height:34vh; }
  .hidden { display:none !important; }
</style>
</head>

<div id="sat"></div>

<div id="menu">
  <h1>Diganta</h1>
  <p>দিগন্ত · <i>horizon</i><br>Learn the planet from above.</p>
  <button id="playGuess">Guess the place<small>5 mystery spots, click where they are</small></button>
  <button id="playJourney">Journey<small>Travel from A to B without zooming out</small></button>

<div id="fhud" class="hud hidden">

    <button id="searchBtn">Go</button>
  </form>
  <div class="row">
    <label><input type="checkbox" id="labelsBox"> Show place names</label>
    <button id="surpriseBtn">Surprise me</button>
  </div>
  <div id="fPlace"></div>
</div>

  <polygon points="0,-27 7,0 -7,0" fill="#e5484d"/>

  <g font-size="12" font-weight="700" fill="#eef2f6" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif">

</svg>

<div id="ghud" class="hud hidden">
  <div>Round <b id="round">1</b>/5 · Score <b id="score">0</b><a class="toMenu">Menu</a></div>
  <ul id="gHints"></ul>
  <button id="gHintBtn" class="small">Hint (−500)</button>
</div>

<div id="jhud" class="hud hidden">
  <div><b id="jFrom"></b> → <b id="jTo"></b><a class="toMenu">Menu</a></div>
  <div class="look" id="jLook"></div>
  <div class="look"><span id="jTime">0:00</span> · <span id="jKm">0</span> km travelled</div>
  <div id="hint"></div>
  <div class="row"><button id="hintBtn">Hint: which way?</button><button id="giveUpBtn" class="ghost">Give up</button></div>
</div>

<div id="guessBox" class="hidden">
  <div id="guessMap"></div>
  <button id="guessBtn" disabled>Click the map to guess</button>
</div>

<div id="result">
  <div id="resultMap"></div>

  <p id="resultText"></p>
  <div id="factCard" class="hidden">
    <p id="factText"></p>
    <p id="clueText"><b>The giveaway:</b> <span></span></p>
  </div>
  <button id="nextBtn">Next round</button>
</div>

// ---------- geo helpers ----------
const rad = d => d * Math.PI / 180;
function haversineKm(a, b) {
  const dLat = rad(b[0] - a[0]), dLng = rad(b[1] - a[1]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLng / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.sqrt(h));
}
function bearing(a, b) {
  const y = Math.sin(rad(b[1] - a[1])) * Math.cos(rad(b[0]));
  const x = Math.cos(rad(a[0])) * Math.sin(rad(b[0])) - Math.sin(rad(a[0])) * Math.cos(rad(b[0])) * Math.cos(rad(b[1] - a[1]));
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}
const compass = (a, b) => ["north", "north-east", "east", "south-east", "south", "south-west", "west", "north-west"][Math.round(bearing(a, b) / 45) % 8];
const scoreFor = km => Math.round(5000 * Math.exp(-km / 2000));

function showResult(title, text, nextLabel, fit, place) {
  $("resultTitle").textContent = title;

  $("nextBtn").textContent = nextLabel;
  $("result").style.display = "block";
  resultMap.invalidateSize();
  resultMap.fitBounds(fit.pad(0.3), { maxZoom: 10 });
}

}

const HINTS = [p => `Climate: ${p[6]}`, p => `Continent: ${p[5]}`, p => `Country: ${p[4]}`];
$("gHintBtn").onclick = () => {
  const li = document.createElement("li");
  li.textContent = HINTS.at(gHintsUsed)(current);
  $("gHints").append(li);
  gHintsUsed++;
  $("gHintBtn").disabled = gHintsUsed === HINTS.length;
};

function startGame() {
  mode = "guess";
  deck = [...PLACES].sort(() => Math.random() - .5).slice(0, ROUNDS); // ponytail: biased shuffle, fine for 5 picks
  round = 0; total = 0;
  startRound();
}

function startRound() {
  current = deck[round];
  const [lat, lng, z] = current;
  trail.setLatLngs([]);
  sat.setMaxZoom(18).setMinZoom(Math.max(z - 3, 2));
  sat.setMaxBounds(L.latLng(lat, lng).toBounds(400000)); // 400 km box: zoom out for clues, not to a continent
  sat.setView([lat, lng], z, { animate: false });
  if (guessMarker) { guessMap.removeLayer(guessMarker); guessMarker = null; }
  guessMap.setView([20, 0], 1);
  $("guessBtn").disabled = true;
  $("guessBtn").textContent = "Click the map to guess";
  gHintsUsed = 0;
  $("gHints").replaceChildren();
  $("gHintBtn").disabled = false;
  $("round").textContent = round + 1;
  $("score").textContent = total;
  $("result").style.display = "none";
  show("menu", false); show("jhud", false); show("ghud", true); show("guessBox", true); show("compass", true);
}

guessMap.on("click", e => {
  const ll = e.latlng.wrap();
  if (guessMarker) guessMarker.setLatLng(ll); else guessMarker = L.marker(ll).addTo(guessMap);
  $("guessBtn").disabled = false;
  $("guessBtn").textContent = "Guess";
});

$("guessBtn").onclick = () => {
  const g = guessMarker.getLatLng(), actual = [current[0], current[1]];
  const km = haversineKm([g.lat, g.lng], actual);
  const pts = Math.max(0, scoreFor(km) - HINT_COST * gHintsUsed);
  total += pts;
  $("score").textContent = total;
  show("guessBox", false);
  resultLayer.clearLayers();
  L.marker([g.lat, g.lng]).addTo(resultLayer);
  L.circleMarker(actual, { radius: 8, color: "#ffb020", fillOpacity: 1 }).addTo(resultLayer);
  L.polyline([[g.lat, g.lng], actual], { color: "#ffb020", dashArray: "6 6" }).addTo(resultLayer);
  const last = round === ROUNDS - 1;
  const hintNote = gHintsUsed ? ` (${gHintsUsed} hint${gHintsUsed > 1 ? "s" : ""}, −${HINT_COST * gHintsUsed})` : "";
  showResult(current[3], `${Math.round(km).toLocaleString()} km away · +${pts} points${hintNote}`,
    last ? `Final: ${total} / ${ROUNDS * 5000} · Play again` : "Next round",
    L.latLngBounds([[g.lat, g.lng], actual]), current);
};

// ---------- Journey mode ----------
let jr, jLast = -1, path, travelled, jStart, jTimer, hints, jDone;

function startJourney() {
  mode = "setup"; // map moves below must not count as travel
  let i; do { i = Math.floor(Math.random() * JOURNEYS.length); } while (i === jLast);
  jLast = i; jr = JOURNEYS[i];
  const start = L.latLng(jr.from[0], jr.from[1]);
  sat.setMaxBounds(null);
  sat.setMinZoom(jr.z).setMaxZoom(jr.z); // zoom locked: you must travel, not zoom out
  sat.setView(start, jr.z, { animate: false });
  path = [start]; travelled = 0; hints = 0; jDone = false;
  mode = "journey";
  trail.setLatLngs(path);
  $("jFrom").textContent = jr.from[2];
  $("jTo").textContent = jr.to[2];
  $("jLook").textContent = "Look for: " + jr.look;
  $("hint").textContent = "";
  $("jKm").textContent = "0";
  jStart = Date.now();
  clearInterval(jTimer);
  jTimer = setInterval(() => $("jTime").textContent = fmtTime(Date.now() - jStart), 1000);
  $("jTime").textContent = "0:00";
  $("result").style.display = "none";
  show("menu", false); show("ghud", false); show("guessBox", false); show("jhud", true);
  show("compass", true); show("needle", false);
}

const fmtTime = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };

sat.on("move", () => {
  if (mode !== "journey" || jDone) return;
  const c = sat.getCenter(), last = path[path.length - 1];
  const d = haversineKm([last.lat, last.lng], [c.lat, c.lng]);
  if (d < 0.5) return;
  path.push(c); travelled += d;
  trail.addLatLng(c);
  $("jKm").textContent = Math.round(travelled);
});

sat.on("moveend", () => {
  if (mode !== "journey" || jDone) return;
  // Arrived once the target sits in the middle part of the screen.
  if (sat.getBounds().pad(-0.25).contains([jr.to[0], jr.to[1]])) finishJourney(true);
});

$("hintBtn").onclick = () => {
  const c = sat.getCenter();
  hints++;
  $("hint").textContent = `Head ${compass([c.lat, c.lng], jr.to)}.`;
  $("needle").setAttribute("transform", `rotate(${bearing([c.lat, c.lng], jr.to)})`); // snapshot, not live: hints shouldn't steer for you
  show("needle", true);
};

// ---------- Free ride ----------
function startFree() {
  mode = "free";
  trail.setLatLngs([]);
  sat.setMaxBounds(null);
  sat.setMaxZoom(20).setMinZoom(2);
  $("fPlace").textContent = "Drag to move, scroll or pinch to zoom.";
  show("menu", false); show("fhud", true); show("compass", true); show("needle", false);
}
// OpenStreetMap Nominatim: free, max 1 request/sec, so search on submit only (never per keystroke).
$("searchForm").onsubmit = async e => {
  e.preventDefault();
  const q = $("searchInput").value.trim();
  if (!q) return;
  $("searchBtn").disabled = true;
  $("fPlace").textContent = "Searching…";
  try {
    const res = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(q));
    const [hit] = await res.json();
    if (!hit) { $("fPlace").textContent = `Couldn't find "${q}".`; return; }
    const [s, n, w, ea] = hit.boundingbox.map(Number);
    sat.flyToBounds([[s, w], [n, ea]], { duration: 3, maxZoom: 17 });
    $("fPlace").textContent = hit.display_name;
  } catch {
    $("fPlace").textContent = "Search failed. Check your connection.";
  } finally {
    setTimeout(() => $("searchBtn").disabled = false, 1000); // respect 1 req/sec
  }
};
$("labelsBox").onchange =e => e.target.checked ? labels.addTo(sat) : sat.removeLayer(labels);
$("surpriseBtn").onclick = () => {
  const [lat, lng, z, name] = PLACES[Math.floor(Math.random() * PLACES.length)];
  $("fPlace").textContent = "Flying to " + name + "…";
  sat.flyTo([lat, lng], z, { duration: 4 });
  sat.once("moveend", () => $("fPlace").textContent = name);
};
$("giveUpBtn").onclick = () => finishJourney(false);

function finishJourney(arrived) {
  jDone = true;
  clearInterval(jTimer);
  const straight = haversineKm(jr.from, jr.to);
  const eff = travelled ? Math.min(100, Math.round(straight / travelled * 100)) : 0;
  resultLayer.clearLayers();
  L.polyline(path, { color: "#ffb020", weight: 4 }).addTo(resultLayer);
  L.polyline([jr.from.slice(0, 2), jr.to.slice(0, 2)], { color: "#555", dashArray: "6 6", weight: 2 }).addTo(resultLayer);
  L.circleMarker(jr.from.slice(0, 2), { radius: 7, color: "#2b7", fillOpacity: 1 }).addTo(resultLayer).bindTooltip(jr.from[2], { permanent: true });
  L.circleMarker(jr.to.slice(0, 2), { radius: 7, color: "#ffb020", fillOpacity: 1 }).addTo(resultLayer).bindTooltip(jr.to[2], { permanent: true });
  const text = arrived
    ? `${fmtTime(Date.now() - jStart)} · ${Math.round(travelled)} km travelled for a ${Math.round(straight)} km trip (${eff}% direct)` + (hints ? ` · ${hints} hint${hints > 1 ? "s" : ""}` : "")
    : `${jr.to[2]} was ${compass(jr.from, jr.to)} of ${jr.from[2]}, ${Math.round(straight)} km away. Grey line = the direct route.`;
  showResult(arrived ? `You reached ${jr.to[2]}!` : "Here's where it was", text, "Next journey",
    L.latLngBounds([...path, jr.to.slice(0, 2)]));
}

// ---------- wiring ----------
$("playGuess").onclick = startGame;
$("playJourney").onclick = startJourney;
$("playFree").onclick = startFree;
$("nextBtn").onclick = () => {
  if (mode === "journey") return startJourney();
  if (round === ROUNDS - 1) return startGame();
  round++; startRound();
};

// Sanity checks: London–Paris ≈ 344 km; Giza → Suez is north-east.
console.assert(Math.abs(haversineKm([51.5074, -0.1278], [48.8566, 2.3522]) - 344) < 5, "haversine broken");
console.assert(compass([29.977, 31.132], [30.59, 32.30]) === "north-east", "compass broken");
</script>
